name: Build and Release APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.8, v1.0.9, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        
      - name: Get version name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME}"
        
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk AdSkipper-${{ steps.get_version.outputs.VERSION_NAME }}.apk
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: AdSkipper-${{ steps.get_version.outputs.VERSION_NAME }}.apk
          body: |
            ## 🎉 AdSkipper v${{ steps.get_version.outputs.VERSION_NAME }}
            
            ### 📱 Download & Install
            Download the APK below and install on your Android device.
            
            **Minimum Android Version:** 7.0 (API 24)
            
            ### 🚀 What's New
            - Added donation pop up on every 2nd opening of the app
            
            ### 📥 Installation Steps
            1. Download the APK file below
            2. Enable "Install from Unknown Sources" in your device settings
            3. Open the APK file and install
            4. Grant Accessibility Permission when prompted
            5. Enjoy ad-free YouTube viewing!
            
            ### 🐛 Bug Fixes
            - Fixed Portuguese "pular" matching "popular" button issue
            - Improved skip button detection accuracy
            
            ---
            **Note:** This is an unsigned APK. You may need to enable installation from unknown sources.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

